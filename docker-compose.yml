version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: moss-discgolf-db
    environment:
      POSTGRES_USER: discgolf
      POSTGRES_PASSWORD: discgolf_dev_password
      POSTGRES_DB: moss_discgolf
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U discgolf']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moss-discgolf-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://discgolf:discgolf_dev_password@postgres:5432/moss_discgolf
      PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: moss-discgolf-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    ports:
      - '3000:3000'
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev

volumes:
  postgres_data:

networks:
  default:
    name: moss-discgolf-network
